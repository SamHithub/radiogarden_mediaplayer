<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Global Mercator | Map & Heatmap Player</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              glow: '#00f5a0'
            },
            dark: {
              bg: '#070b12',
              surface: '#0d131f',
              card: '#141d2e',
              border: '#1e293b'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- HLS.js for stream playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Leaflet CSS & JS (Flat Mercator Web EPSG:3857) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet.heat Plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Leaflet.markercluster Plugin -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070b12; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Equalizer Pulse */
    .eq-bar {
      animation: eqPulse 1.2s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { animation-delay: 0.5s; }
    .eq-bar:nth-child(4) { animation-delay: 0.2s; }
    .eq-bar:nth-child(5) { animation-delay: 0.4s; }
    @keyframes eqPulse {
      0% { height: 15%; }
      50% { height: 95%; }
      100% { height: 30%; }
    }

    /* Custom Leaflet Map Dark Styling */
    .leaflet-container {
      background-color: #070b12 !important;
      font-family: inherit;
    }
    .leaflet-popup-content-wrapper {
      background: #141d2e !important;
      color: #f1f5f9 !important;
      border: 1px solid #1e293b;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
      padding: 4px;
    }
    .leaflet-popup-tip {
      background: #141d2e !important;
    }
    .leaflet-popup-close-button {
      color: #94a3b8 !important;
      padding: 6px !important;
    }
    .leaflet-popup-close-button:hover {
      color: #ffffff !important;
    }
    /* MarkerCluster Theme customization */
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background-color: rgba(16, 185, 129, 0.3) !important;
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background-color: #10b981 !important;
      color: #000000 !important;
      font-weight: 700;
      font-family: monospace;
    }
  </style>
</head>

<body class="bg-dark-bg text-slate-100 font-sans h-full flex flex-col antialiased selection:bg-brand-500 selection:text-black overflow-hidden">

  <!-- Top App Navigation Header -->
  <header class="h-14 bg-dark-surface/90 backdrop-blur-md border-b border-dark-border px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <button id="toggleSidebarBtn" class="p-2 rounded-lg bg-dark-card border border-dark-border text-slate-300 hover:text-white hover:border-brand-500 transition" title="Alternar panel">
        <i class="ph-bold ph-sidebar text-lg"></i>
      </button>

      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-brand-glow p-[2px] shadow-md shadow-brand-500/20">
          <div class="w-full h-full bg-dark-bg rounded-[6px] flex items-center justify-center">
            <i class="ph-bold ph-broadcast text-base text-brand-400"></i>
          </div>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-tight text-white flex items-center gap-2 leading-none">
            GeoRadio Global
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/10 border border-brand-500/30 text-brand-400 font-medium font-mono">2D MAP</span>
          </h1>
          <p class="text-[11px] text-slate-400 leading-none mt-0.5">Mapa interactivo con Heatmap y Clúster</p>
        </div>
      </div>
    </div>

    <!-- Quick stats & active layer status -->
    <div class="flex items-center gap-3">
      <div class="hidden md:flex items-center gap-2 bg-dark-card border border-dark-border px-3 py-1.5 rounded-lg text-xs">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-500"></span>
        </span>
        <span class="text-slate-400">Sintonizadas:</span>
        <span id="activeStationBadge" class="font-semibold text-brand-400">Ninguna</span>
      </div>

      <button id="toggleFavsViewBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-card border border-dark-border text-slate-300 hover:text-amber-400 hover:border-amber-400/40 transition">
        <i class="ph-fill ph-star text-amber-400"></i>
        <span class="hidden sm:inline">Favoritos</span>
        <span id="favsCountPill" class="bg-amber-400/20 text-amber-300 text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Workspace: Sidebar (Left) + Mercator Map (Right) -->
  <div class="flex-1 flex relative overflow-hidden">

    <!-- Left Control Sidebar -->
    <aside id="sidebar" class="w-80 sm:w-96 bg-dark-surface border-r border-dark-border flex flex-col z-20 transition-all duration-300 ease-in-out shrink-0">
      
      <!-- Upper Controls Form -->
      <div class="p-3.5 border-b border-dark-border space-y-3 shrink-0 bg-dark-surface/50">
        
        <!-- Region / Playlist Source -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">
            Región M3U8
          </label>
          <div class="relative">
            <i class="ph ph-globe absolute left-3 top-1/2 -translate-y-1/2 text-brand-400 pointer-events-none"></i>
            <select id="playlistSelect" class="w-full bg-dark-card border border-dark-border text-xs rounded-xl pl-8 pr-7 py-2 text-slate-200 focus:outline-none focus:border-brand-500 appearance-none cursor-pointer">
              <option value="radios_america_del_sur.m3u8">América del Sur</option>
              <option value="radios_america_del_norte.m3u8">América del Norte</option>
              <option value="radios_europa.m3u8">Europa</option>
              <option value="radios_asia.m3u8">Asia</option>
              <option value="radios_africa.m3u8">África</option>
              <option value="radios_oceania.m3u8">Oceanía</option>
              <option value="radios_otros.m3u8">Otros</option>
              <option value="radio_garden_global.m3u8">Catálogo Global Completo</option>
              <option value="__custom__">-- Cargar URL M3U8 Externa --</option>
            </select>
            <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
          </div>
        </div>

        <!-- Custom URL Input (Hidden by default) -->
        <div id="customUrlBox" class="hidden">
          <div class="flex gap-1.5">
            <input type="text" id="customUrlInput" placeholder="https://.../radios.m3u8" class="flex-1 bg-dark-card border border-dark-border rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-brand-500">
            <button id="loadCustomUrlBtn" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-black font-semibold text-xs rounded-lg transition">Cargar</button>
          </div>
        </div>

        <!-- Live Search Field -->
        <div class="relative">
          <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" placeholder="Buscar por estación o ciudad..." class="w-full bg-dark-card border border-dark-border rounded-xl pl-8 pr-8 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-brand-500">
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
            <i class="ph ph-x-circle text-sm"></i>
          </button>
        </div>

        <!-- Filter Row: Genre & Country -->
        <div class="grid grid-cols-2 gap-2">
          <!-- Genre Dropdown -->
          <div class="relative">
            <select id="genreSelect" class="w-full bg-dark-card border border-dark-border text-xs rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none focus:border-brand-500 appearance-none cursor-pointer pr-6">
              <option value="">Todos los Géneros</option>
              <option value="rock">🎸 Rock / Metal</option>
              <option value="pop">🎤 Pop / Top Hits</option>
              <option value="electronic">🎧 Electro / Dance</option>
              <option value="chill">☕ Chill / Ambient</option>
              <option value="jazz">🎷 Jazz / Blues</option>
              <option value="classic">🎻 Clásica</option>
              <option value="latina">💃 Latina / Salsa</option>
              <option value="regional">🎺 Regional</option>
              <option value="country">🤠 Country</option>
              <option value="hiphop">🧢 Hip Hop / Rap</option>
              <option value="retro">📻 Retro / 80s 90s</option>
              <option value="news">📰 Noticias / Info</option>
              <option value="sports">⚽ Deportes</option>
              <option value="christian">🕊️ Cristiana</option>
            </select>
            <i class="ph ph-caret-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>

          <!-- Country Dropdown -->
          <div class="relative">
            <select id="countrySelect" class="w-full bg-dark-card border border-dark-border text-xs rounded-xl px-2.5 py-2 text-slate-200 focus:outline-none focus:border-brand-500 appearance-none cursor-pointer pr-6">
              <option value="">Todos los Países</option>
            </select>
            <i class="ph ph-caret-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>
        </div>

        <!-- Map Layer Toggle & Style Switcher -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-dark-border/60">
          <!-- Heatmap vs Pins Toggle -->
          <div class="flex bg-dark-card border border-dark-border rounded-xl p-0.5 text-[11px]">
            <button id="heatModeBtn" class="flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition text-slate-400 hover:text-white">
              <i class="ph-fill ph-fire text-amber-400"></i> Heatmap
            </button>
            <button id="pinsModeBtn" class="flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition bg-brand-500 text-black shadow">
              <i class="ph-fill ph-map-pin"></i> Pines
            </button>
          </div>

          <!-- Base Tile Selector -->
          <div class="relative">
            <select id="tileSelect" class="w-full h-full bg-dark-card border border-dark-border text-[11px] rounded-xl px-2.5 py-1 text-slate-300 focus:outline-none focus:border-brand-500 appearance-none cursor-pointer pr-6">
              <option value="dark">🌙 Carto Dark Matter</option>
              <option value="voyager">🗺️ Carto Voyager</option>
              <option value="osm">🌐 OpenStreetMap</option>
              <option value="positron">☀️ Carto Positron</option>
            </select>
            <i class="ph ph-caret-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-[10px] pointer-events-none"></i>
          </div>
        </div>

        <!-- Counter Indicator -->
        <div class="flex items-center justify-between text-[11px] text-slate-400 pt-0.5">
          <span>Estaciones visibles:</span>
          <span class="font-bold text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded border border-brand-500/20">
            <span id="filteredCountLabel">0</span> / <span id="totalCountLabel">0</span>
          </span>
        </div>

      </div>

      <!-- Station List Items (Virtual/Paged) -->
      <div id="stationListContainer" class="flex-1 overflow-y-auto p-2 space-y-1.5">
        <!-- Station items will be appended here dynamically -->
      </div>

      <!-- Loading / Empty Overlay for list -->
      <div id="sidebarLoader" class="hidden flex-col items-center justify-center py-12 text-center gap-2">
        <div class="w-8 h-8 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-400 font-medium">Cargando emisoras...</p>
      </div>

    </aside>

    <!-- Mercator Map Viewport (Leaflet EPSG:3857) -->
    <main class="flex-1 relative h-full bg-dark-bg">
      <div id="map" class="w-full h-full"></div>

      <!-- Map Floating Helper Badge -->
      <div class="absolute top-4 right-4 z-[500] bg-dark-surface/90 backdrop-blur-md border border-dark-border px-3 py-2 rounded-xl text-xs flex items-center gap-2 shadow-xl pointer-events-auto">
        <i class="ph-fill ph-compass text-brand-400 text-base"></i>
        <div class="flex flex-col text-[11px]">
          <span class="font-semibold text-slate-200">Proyección Mercator Web</span>
          <span class="text-slate-400 text-[10px]">Haz zoom para explorar pines individuales</span>
        </div>
        <button id="resetMapBoundsBtn" class="ml-2 px-2 py-1 bg-dark-card hover:bg-dark-border border border-dark-border rounded-lg text-slate-300 hover:text-white transition" title="Reajustar vista">
          <i class="ph ph-arrows-out-simple"></i>
        </button>
      </div>

      <!-- Quick Genre Ribbon over the map -->
      <div class="absolute bottom-4 left-4 right-4 z-[500] flex items-center gap-1.5 overflow-x-auto pb-1 pointer-events-auto no-scrollbar">
        <button data-quick-genre="" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-semibold bg-dark-card/90 backdrop-blur-md border border-brand-500 text-brand-400 shrink-0 hover:bg-brand-500 hover:text-black transition">
          Todos
        </button>
        <button data-quick-genre="rock" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          🎸 Rock
        </button>
        <button data-quick-genre="pop" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          🎤 Pop
        </button>
        <button data-quick-genre="electronic" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          🎧 Electro
        </button>
        <button data-quick-genre="latina" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          💃 Latina
        </button>
        <button data-quick-genre="jazz" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          🎷 Jazz
        </button>
        <button data-quick-genre="news" class="quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition">
          📰 Noticias
        </button>
      </div>

    </main>

  </div>

  <!-- Bottom Player Console -->
  <aside class="h-16 bg-dark-surface/95 backdrop-blur-xl border-t border-dark-border px-4 flex items-center justify-between gap-3 shrink-0 z-30">
    
    <!-- Active Station Details -->
    <div class="flex items-center gap-3 w-1/3 min-w-0">
      <div id="playerLogo" class="w-10 h-10 rounded-lg bg-dark-card border border-dark-border flex items-center justify-center shrink-0 overflow-hidden text-brand-400 font-bold text-xs">
        <i class="ph-fill ph-radio text-lg"></i>
      </div>
      <div class="min-w-0 flex-1">
        <h3 id="playerTitle" class="text-xs font-semibold text-white truncate leading-snug">
          Selecciona una emisora
        </h3>
        <p id="playerSubtitle" class="text-[11px] text-slate-400 truncate">
          Explora el mapa o la lista
        </p>
      </div>
      <button id="playerFavBtn" class="p-1.5 text-slate-400 hover:text-amber-400 transition shrink-0" title="Favorito">
        <i class="ph ph-star text-base"></i>
      </button>
    </div>

    <!-- Playback & Equalizer Controls -->
    <div class="flex flex-col items-center justify-center gap-1">
      <div class="flex items-center gap-3">
        <button id="prevBtn" class="p-1.5 text-slate-400 hover:text-white transition" title="Anterior">
          <i class="ph-fill ph-skip-back text-base"></i>
        </button>
        <button id="playBtn" class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-brand-glow text-black flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-lg shadow-brand-500/25">
          <i id="playIcon" class="ph-fill ph-play text-lg ml-0.5"></i>
        </button>
        <button id="nextBtn" class="p-1.5 text-slate-400 hover:text-white transition" title="Siguiente">
          <i class="ph-fill ph-skip-forward text-base"></i>
        </button>
      </div>

      <!-- Live Equalizer Animation -->
      <div id="playerVisualizer" class="flex items-end gap-0.5 h-2.5 opacity-0 transition-opacity">
        <span class="eq-bar w-0.5 bg-brand-400 rounded-full h-1"></span>
        <span class="eq-bar w-0.5 bg-brand-400 rounded-full h-1"></span>
        <span class="eq-bar w-0.5 bg-brand-400 rounded-full h-1"></span>
        <span class="eq-bar w-0.5 bg-brand-400 rounded-full h-1"></span>
        <span class="eq-bar w-0.5 bg-brand-400 rounded-full h-1"></span>
      </div>
    </div>

    <!-- Volume & Stream Controls -->
    <div class="flex items-center justify-end gap-2 w-1/3">
      <button id="muteBtn" class="p-1.5 text-slate-400 hover:text-white transition">
        <i id="volumeIcon" class="ph-fill ph-speaker-high text-lg"></i>
      </button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.9" class="w-20 sm:w-28 accent-brand-500 bg-dark-card cursor-pointer">
    </div>

  </aside>

  <!-- HTML5 Audio Core -->
  <audio id="audioElement" preload="none"></audio>

      dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      voyager: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',

    let heatLayer = null;

    /**
     * Resolves Lat/Lng coordinates for a given city and country
     */
    function resolveCoordinates(city, country, idSeed) {
      if (GEO_FALLBACK[city]) {
        return GEO_FALLBACK[city];
      }
      for (const [knownCity, coords] of Object.entries(GEO_FALLBACK)) {
        if (city.toLowerCase().includes(knownCity.toLowerCase())) {
          return coords;
        }
      }
      if (COUNTRY_CENTROIDS[country]) {
        const [cLat, cLng] = COUNTRY_CENTROIDS[country];
        // Jitter coordinate slightly based on ID hash to disperse stations around country center
        let hash = 0;
        for (let i = 0; i < idSeed.length; i++) hash = ((hash << 5) - hash) + idSeed.charCodeAt(i);
        const latOffset = ((Math.abs(hash) % 1000) / 1000 - 0.5) * 3.5;
        const lngOffset = ((Math.abs(hash >> 3) % 1000) / 1000 - 0.5) * 3.5;
        return [cLat + latOffset, cLng + lngOffset];
      }
      // Global fallback jitter around Greenwich/Equator
      return [10.0 + (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 40];
    }

    /**
     * STREAMING_CHUNK:Parsing M3U8 content and extracting metadata...
     */
    function parseM3U8(content) {
      const lines = content.split(/\r?\n/);
      const stations = [];
      let currentInfo = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const firstComma = line.indexOf(',');
          const metaPart = firstComma !== -1 ? line.substring(0, firstComma) : line;
          const rawTitle = firstComma !== -1 ? line.substring(firstComma + 1).trim() : 'Estación';

          const idMatch = metaPart.match(/tvg-id="([^"]*)"/i);
          const nameMatch = metaPart.match(/tvg-name="([^"]*)"/i);
          const logoMatch = metaPart.match(/tvg-logo="([^"]*)"/i);
          const groupMatch = metaPart.match(/group-title="([^"]*)"/i);
          const countryMatch = metaPart.match(/tvg-country="([^"]*)"/i);

          let city = '';
          let country = '';
          const group = groupMatch ? groupMatch[1] : '';

          if (group.includes('-')) {
            const parts = group.split('-');
            country = parts[0].trim();
            city = parts.slice(1).join('-').trim();
          } else {
            country = group.trim();
          }

          const parenMatch = rawTitle.match(/\((.*?)\)$/);
          if (parenMatch) {
            const inner = parenMatch[1];
            if (inner.includes('-')) {
              const p = inner.split('-');
              city = city || p[0].trim();
              country = country || p[1].trim();
            } else if (inner.includes(',')) {
              const p = inner.split(',');
              city = city || p[0].trim();
              country = country || p[1].trim();
            }
          }

          let cleanTitle = rawTitle;
          if (parenMatch) {
            cleanTitle = rawTitle.substring(0, parenMatch.index).trim();
          }
          if (nameMatch && nameMatch[1]) {
            cleanTitle = nameMatch[1];
          }

          const id = idMatch ? idMatch[1] : `st_${stations.length}`;

          // Detect genres
          const lowerCheck = `${cleanTitle} ${rawTitle}`.toLowerCase();
          const detectedGenres = [];
          for (const [gKey, kws] of Object.entries(GENRE_RULES)) {
            if (kws.some(kw => lowerCheck.includes(kw))) {
              detectedGenres.push(gKey);
            }
          }

          const coords = resolveCoordinates(city, country, id);

          currentInfo = {
            id,
            title: cleanTitle || 'Radio',
            city: city || 'En vivo',
            country: country || 'Global',
            countryCode: countryMatch ? countryMatch[1] : '',
            logo: logoMatch ? logoMatch[1] : '',
            genres: detectedGenres,
            lat: coords[0],
            lng: coords[1],
            rawTitle
          };
        } else if (!line.startsWith('#') && currentInfo) {
          currentInfo.streamUrl = line;
          stations.push(currentInfo);
          currentInfo = null;
        }
      }
      return stations;
    }

    /**
     * STREAMING_CHUNK:Loading playlist and populating country filters...
     */
    async function loadPlaylist(fileNameOrUrl) {
      sidebarLoader.classList.remove('hidden');
      stationListContainer.innerHTML = '';

      try {
        let response = null;
        try {
          response = await fetch(fileNameOrUrl);
          if (!response.ok) throw new Error('Relative fetch failed');
        } catch (e) {
          // Fallback to GitHub raw
          const rawUrl = `https://raw.githubusercontent.com/SamHithub/radiogarden_mediaplayer/main/${fileNameOrUrl}`;
          response = await fetch(rawUrl);
        }

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        state.allStations = parseM3U8(text);

        totalCountLabel.textContent = state.allStations.length.toLocaleString();
        populateCountries();
        applyFilters();
      } catch (err) {
        console.error('Error loading playlist:', err);
        sidebarLoader.classList.add('hidden');
        stationListContainer.innerHTML = `
          <div class="p-4 text-center text-rose-400 text-xs">
            <i class="ph ph-warning-circle text-2xl mb-1"></i>
            <p class="font-semibold">Error al cargar la lista M3U8</p>
            <p class="text-[10px] text-slate-400 mt-1">Verifica la URL o conexión al repositorio.</p>
          </div>
        `;
      }
    }

    function populateCountries() {
      const countries = new Set();
      state.allStations.forEach(s => {
        if (s.country && s.country !== 'Global') countries.add(s.country);
      });
      const sorted = Array.from(countries).sort((a, b) => a.localeCompare(b));
      countrySelect.innerHTML = '<option value="">Todos los Países</option>';
      sorted.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        countrySelect.appendChild(opt);
      });
    }

    /**
     * STREAMING_CHUNK:Filtering and updating Mercator map layers...
     */
    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedCountry = countrySelect.value;
      const selectedGenre = genreSelect.value;

      state.filteredStations = state.allStations.filter(st => {
        if (state.showOnlyFavorites && !state.favorites.has(st.id)) return false;
        if (selectedCountry && st.country !== selectedCountry) return false;
        if (selectedGenre && !st.genres.includes(selectedGenre)) return false;
        if (query) {
          const matchTitle = st.title.toLowerCase().includes(query);
          const matchCity = st.city.toLowerCase().includes(query);
          const matchCountry = st.country.toLowerCase().includes(query);
          return matchTitle || matchCity || matchCountry;
        }
        return true;
      });

      filteredCountLabel.textContent = state.filteredStations.length.toLocaleString();
      sidebarLoader.classList.add('hidden');

      renderSidebarList();
      updateMapLayers();
    }

    /**
     * Updates Leaflet Heatmap and MarkerCluster layers based on filtered data
     */
    function updateMapLayers() {
      // Clear current clusters
      markerClusterGroup.clearLayers();

      // Remove heatlayer if present
      if (heatLayer && map.hasLayer(heatLayer)) {
        map.removeLayer(heatLayer);
      }

      if (state.filteredStations.length === 0) return;

      if (state.mapMode === 'heat') {
        // Prepare heat points [lat, lng, intensity]
        const heatPoints = state.filteredStations.map(st => [st.lat, st.lng, 0.7]);
        heatLayer = L.heatLayer(heatPoints, {
          radius: 24,
          blur: 18,
          maxZoom: 12,
          gradient: { 0.2: '#00f5a0', 0.5: '#10b981', 0.8: '#f59e0b', 1.0: '#ef4444' }
        }).addTo(map);
      } else {
        // Pins Mode with MarkerCluster
        const customPinIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div class="w-4 h-4 rounded-full bg-brand-500 border-2 border-dark-bg shadow-md shadow-brand-500/50 flex items-center justify-center hover:scale-125 transition-transform"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        const markers = [];
        state.filteredStations.forEach(st => {
          const marker = L.marker([st.lat, st.lng], { icon: customPinIcon });
          
          const popupContent = `
            <div class="p-2 space-y-2 min-w-[200px]">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-dark-card border border-dark-border flex items-center justify-center font-bold text-xs text-brand-400 overflow-hidden shrink-0">
                  ${st.logo ? `<img src="${st.logo}" class="w-full h-full object-cover">` : st.title.substring(0, 2).toUpperCase()}
                </div>
                <div class="min-w-0 flex-1">
                  <h4 class="font-bold text-xs text-white truncate leading-tight">${st.title}</h4>
                  <p class="text-[10px] text-slate-400 truncate">${st.city} - ${st.country}</p>
                </div>
              </div>
              <div class="flex items-center justify-between pt-1 border-t border-dark-border/60">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-brand-500/10 text-brand-400 border border-brand-500/20 font-medium">
                  ${st.genres[0] ? st.genres[0].toUpperCase() : 'EN VIVO'}
                </span>
                <button onclick="window.playStationById('${st.id}')" class="px-2.5 py-1 rounded-md bg-brand-500 hover:bg-brand-400 text-black font-semibold text-[11px] flex items-center gap-1 transition">
                  <i class="ph-fill ph-play"></i> Escuchar
                </button>
              </div>
            </div>
          `;
          marker.bindPopup(popupContent);
          markers.push(marker);
        });

        markerClusterGroup.addLayers(markers);
      }

      // Auto zoom/fit bounds if we have stations
      if (state.filteredStations.length > 0) {
        const samplePoints = state.filteredStations.slice(0, 300).map(s => [s.lat, s.lng]);
        try {
          map.fitBounds(L.latLngBounds(samplePoints), { padding: [50, 50], maxZoom: 8 });
        } catch (e) {}
      }
    }

    /**
     * STREAMING_CHUNK:Rendering sidebar station list...
     */
    function renderSidebarList() {
      stationListContainer.innerHTML = '';
      const displayBatch = state.filteredStations.slice(0, 75); // Render initial fast batch

      if (displayBatch.length === 0) {
        stationListContainer.innerHTML = `
          <div class="p-6 text-center text-slate-500 text-xs">
            <i class="ph ph-radio text-3xl mb-1 text-slate-600"></i>
            <p>No se encontraron estaciones.</p>
          </div>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();

      displayBatch.forEach((st, idx) => {
        const isPlaying = state.currentStation && state.currentStation.id === st.id && !audioElement.paused;
        const isFav = state.favorites.has(st.id);

        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border ${
          isPlaying ? 'bg-brand-500/10 border-brand-500' : 'bg-dark-card hover:bg-dark-border/40 border-dark-border'
        } flex items-center justify-between gap-2.5 cursor-pointer transition group`;

        card.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div class="w-8 h-8 rounded-lg bg-dark-bg border border-dark-border flex items-center justify-center font-bold text-xs text-brand-400 shrink-0 overflow-hidden">
              ${st.logo ? `<img src="${st.logo}" class="w-full h-full object-cover">` : st.title.substring(0, 2).toUpperCase()}
            </div>
            <div class="min-w-0 flex-1">
              <h4 class="text-xs font-semibold text-white truncate group-hover:text-brand-400 transition">${st.title}</h4>
              <p class="text-[10px] text-slate-400 truncate">${st.city} - ${st.country}</p>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button class="list-fav-btn p-1 text-slate-400 hover:text-amber-400 transition" title="Favorito">
              <i class="${isFav ? 'ph-fill ph-star text-amber-400' : 'ph ph-star'} text-sm"></i>
            </button>
            <button class="list-play-btn w-7 h-7 rounded-lg ${
              isPlaying ? 'bg-brand-500 text-black' : 'bg-dark-bg border border-dark-border text-slate-200 group-hover:border-brand-500'
            } flex items-center justify-center text-xs transition">
              <i class="ph-fill ${isPlaying ? 'ph-pause' : 'ph-play'}"></i>
            </button>
          </div>
        `;

        card.addEventListener('click', () => {
          playStation(st, idx);
          map.setView([st.lat, st.lng], Math.max(map.getZoom(), 7), { animate: true });
        });

        card.querySelector('.list-fav-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(st.id);
        });

        fragment.appendChild(card);
      });

    /**
     * STREAMING_CHUNK:Audio stream player engine (HLS & HTML5)...
     */
    function playStation(station, index) {
      if (!station || !station.streamUrl) return;

      state.currentStation = station;
      state.currentIndex = index !== undefined ? index : state.filteredStations.findIndex(s => s.id === station.id);

      playerTitle.textContent = station.title;
      playerSubtitle.textContent = `${station.city} - ${station.country}`;
      activeStationBadge.textContent = station.title;

      if (station.logo) {
        playerLogo.innerHTML = `<img src="${station.logo}" class="w-full h-full object-cover">`;
      } else {
        playerLogo.innerHTML = `<span class="text-brand-400 font-bold">${station.title.substring(0, 2).toUpperCase()}</span>`;
      }

      updatePlayerFavIcon();

      if (state.hlsInstance) {
        state.hlsInstance.destroy();
        state.hlsInstance = null;
      }

      const url = station.streamUrl;
      const isHls = url.includes('.m3u8');

      if (isHls && Hls.isSupported()) {
        const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(audioElement);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          audioElement.play().catch(handleAudioError);
        });
        state.hlsInstance = hls;
      } else {
        audioElement.src = url;
        audioElement.play().catch(handleAudioError);
      }

      // Update Native MediaSession
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: station.title,
          artist: `${station.city}, ${station.country}`,
          album: 'GeoRadio Mercator'
        });
      }

      renderSidebarList();
    }

    window.playStationById = function(stationId) {
      const target = state.allStations.find(s => s.id === stationId);
      if (target) playStation(target);
    };

    function handleAudioError(err) {
      console.warn('Audio stream error or autoplay restriction:', err);
      playIcon.className = 'ph-fill ph-play text-lg ml-0.5';
    }

    function toggleFavorite(stationId) {
      if (state.favorites.has(stationId)) {
        state.favorites.delete(stationId);
      } else {
        state.favorites.add(stationId);
      }
      localStorage.setItem('grm_favs', JSON.stringify(Array.from(state.favorites)));
      favsCountPill.textContent = state.favorites.size;
      updatePlayerFavIcon();
      renderSidebarList();
    }

    function updatePlayerFavIcon() {
      if (!state.currentStation) return;
      const isFav = state.favorites.has(state.currentStation.id);
      playerFavBtn.innerHTML = `<i class="${isFav ? 'ph-fill ph-star text-amber-400' : 'ph ph-star'} text-base"></i>`;
    }

    // Audio Playback Events
    playBtn.addEventListener('click', () => {
      if (!state.currentStation && state.filteredStations.length > 0) {
        playStation(state.filteredStations[0], 0);
        return;
      }
      if (audioElement.paused) {
        audioElement.play().catch(handleAudioError);
      } else {
        audioElement.pause();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (state.filteredStations.length === 0) return;
      let prevIdx = state.currentIndex - 1;
      if (prevIdx < 0) prevIdx = state.filteredStations.length - 1;
      playStation(state.filteredStations[prevIdx], prevIdx);
    });

    nextBtn.addEventListener('click', () => {
      if (state.filteredStations.length === 0) return;
      let nextIdx = state.currentIndex + 1;
      if (nextIdx >= state.filteredStations.length) nextIdx = 0;
      playStation(state.filteredStations[nextIdx], nextIdx);
    });

    audioElement.addEventListener('playing', () => {
      playIcon.className = 'ph-fill ph-pause text-lg';
      playerVisualizer.classList.replace('opacity-0', 'opacity-100');
    });

    audioElement.addEventListener('pause', () => {
      playIcon.className = 'ph-fill ph-play text-lg ml-0.5';
      playerVisualizer.classList.replace('opacity-100', 'opacity-0');
    });

    volumeSlider.addEventListener('input', (e) => {
      audioElement.volume = parseFloat(e.target.value);
      audioElement.muted = false;
      volumeIcon.className = audioElement.volume === 0 ? 'ph-fill ph-speaker-slash text-lg text-rose-400' : 'ph-fill ph-speaker-high text-lg';
    });

    muteBtn.addEventListener('click', () => {
      audioElement.muted = !audioElement.muted;
      volumeIcon.className = audioElement.muted ? 'ph-fill ph-speaker-slash text-lg text-rose-400' : 'ph-fill ph-speaker-high text-lg';
    });

    /**
     * STREAMING_CHUNK:Binding UI controls, map interactions, and startup triggers...
     */
    // Sidebar toggle for focused map view
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-ml-80');
      sidebar.classList.toggle('sm:-ml-96');
      setTimeout(() => map.invalidateSize(), 310);
    });

    // Reset Map View
    resetMapBoundsBtn.addEventListener('click', () => {
      if (state.filteredStations.length > 0) {
        const sample = state.filteredStations.slice(0, 300).map(s => [s.lat, s.lng]);
        map.fitBounds(L.latLngBounds(sample), { padding: [50, 50] });
      }
    });

    // Search and Input listeners
    searchInput.addEventListener('input', () => {
      clearSearchBtn.classList.toggle('hidden', !searchInput.value);
      applyFilters();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      applyFilters();
    });

    genreSelect.addEventListener('change', applyFilters);
    countrySelect.addEventListener('change', applyFilters);

    // Quick Genre Ribbon Buttons
    document.querySelectorAll('.quick-genre-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.quick-genre-pill').forEach(b => {
          b.className = 'quick-genre-pill px-3 py-1 rounded-full text-xs font-medium bg-dark-card/90 backdrop-blur-md border border-dark-border text-slate-300 shrink-0 hover:border-brand-500 hover:text-white transition';
        });
        btn.className = 'quick-genre-pill px-3 py-1 rounded-full text-xs font-semibold bg-dark-card/90 backdrop-blur-md border border-brand-500 text-brand-400 shrink-0 hover:bg-brand-500 hover:text-black transition';
        genreSelect.value = btn.getAttribute('data-quick-genre');
        applyFilters();
      });
    });

    // Layer Modes (Heatmap vs Pins)
    heatModeBtn.addEventListener('click', () => {
      state.mapMode = 'heat';
      heatModeBtn.className = 'flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition bg-brand-500 text-black shadow';
      pinsModeBtn.className = 'flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition text-slate-400 hover:text-white';
      updateMapLayers();
    });

    pinsModeBtn.addEventListener('click', () => {
      state.mapMode = 'pins';
      pinsModeBtn.className = 'flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition bg-brand-500 text-black shadow';
      heatModeBtn.className = 'flex-1 py-1.5 rounded-lg flex items-center justify-center gap-1 font-medium transition text-slate-400 hover:text-white';
      updateMapLayers();
    });

    // Tile Selector
    tileSelect.addEventListener('change', (e) => {
      const tileKey = e.target.value;
      if (state.currentTileLayer) map.removeLayer(state.currentTileLayer);
      state.currentTileLayer = L.tileLayer(TILE_LAYERS[tileKey], {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);
    });

    // Playlist Selector
    playlistSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === '__custom__') {
        customUrlBox.classList.remove('hidden');
      } else {
        customUrlBox.classList.add('hidden');
        loadPlaylist(val);
      }
    });

    loadCustomUrlBtn.addEventListener('click', () => {
      const url = customUrlInput.value.trim();
      if (url) loadPlaylist(url);
    });

    // Favorites View Switch
    toggleFavsViewBtn.addEventListener('click', () => {
      state.showOnlyFavorites = !state.showOnlyFavorites;
      toggleFavsViewBtn.classList.toggle('border-amber-400', state.showOnlyFavorites);
      toggleFavsViewBtn.classList.toggle('bg-amber-400/10', state.showOnlyFavorites);
      applyFilters();
    });

    // Window Init
    window.addEventListener('DOMContentLoaded', () => {
      favsCountPill.textContent = state.favorites.size;
      loadPlaylist(playlistSelect.value);
    });
  </script>
</body>
</html>
